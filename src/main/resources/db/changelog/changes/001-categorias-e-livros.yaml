databaseChangeLog:
  - changeSet:
      id: 001-01-create-categorias-livro
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: categorias_livro
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categorias_livro
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_categorias_livro_nome
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-02-create-livros
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: livros
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_livros
                    nullable: false
              - column:
                  name: isbn
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_livros_isbn
              - column:
                  name: titulo
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: quantidade_exemplares
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: valor_reposicao
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: categoria_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: livros
            baseColumnNames: categoria_id
            referencedTableName: categorias_livro
            referencedColumnNames: id
            constraintName: fk_livros_categoria
            onDelete: RESTRICT