databaseChangeLog:
  - changeSet:
      id: 007-01-create-sessao-refresh-token
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: sessao_refresh_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: conta_acesso_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: familia_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: criada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: ultima_atividade_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expira_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: utilizada_em
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revogada_em
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: motivo_revogacao
                  type: VARCHAR(30)
        - addForeignKeyConstraint:
            baseTableName: sessao_refresh_token
            baseColumnNames: conta_acesso_id
            referencedTableName: conta_acesso
            referencedColumnNames: id
            constraintName: fk_sessao_refresh_token_conta
            onDelete: CASCADE

  - changeSet:
      id: 007-02-indices-e-constraints-sessao-refresh-token
      author: curso-spring-2026
      changes:
        - createIndex:
            indexName: idx_sessao_refresh_token_familia
            tableName: sessao_refresh_token
            columns:
              - column:
                  name: familia_id
        - createIndex:
            indexName: idx_sessao_refresh_token_conta
            tableName: sessao_refresh_token
            columns:
              - column:
                  name: conta_acesso_id
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              ADD CONSTRAINT chk_sessao_refresh_token_expiracao
              CHECK (expira_em > criada_em);
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              ADD CONSTRAINT chk_sessao_refresh_token_motivo
              CHECK (motivo_revogacao IS NULL OR motivo_revogacao IN (
                'LOGOUT',
                'LOGOUT_GLOBAL',
                'INATIVIDADE',
                'EXPIRACAO_ABSOLUTA',
                'REUTILIZACAO',
                'CONTA_INATIVA'
              ));