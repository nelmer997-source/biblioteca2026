spring.application.name=biblioteca2026
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca2026_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postdba}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
spring.config.import=optional:file:.env[.properties]
app.security.jwt.issuer=https://biblioteca2026.local
app.security.jwt.expiration=PT30M
app.security.jwt.secret=${JWT_SECRET}
app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.security.initial-admin.nome=${INITIAL_ADMIN_NAME:}
app.security.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.security.initial-admin.cpf=${INITIAL_ADMIN_CPF:}
app.security.initial-admin.login=${INITIAL_ADMIN_LOGIN:}
app.security.initial-admin.senha=${INITIAL_ADMIN_PASSWORD:}
app.security.refresh-token.idle-timeout=${REFRESH_TOKEN_IDLE_TIMEOUT:PT30M}
app.security.refresh-token.absolute-expiration=${REFRESH_TOKEN_ABSOLUTE_EXPIRATION:PT8H}
app.security.authentication-protection.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.security.authentication-protection.failure-window=${AUTH_FAILURE_WINDOW:PT15M}
app.security.authentication-protection.lock-duration=${AUTH_LOCK_DURATION:PT15M}
