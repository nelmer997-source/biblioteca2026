spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_TEST_NAME:biblioteca2026_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postdba}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
app.security.jwt.issuer=https://biblioteca2026.local
app.security.jwt.expiration=PT30M
app.security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.security.initial-admin.enabled=false
app.security.refresh-token.idle-timeout=${REFRESH_TOKEN_IDLE_TIMEOUT:PT30M}
app.security.refresh-token.absolute-expiration=${REFRESH_TOKEN_ABSOLUTE_EXPIRATION:PT8H}
app.security.authentication-protection.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.security.authentication-protection.failure-window=${AUTH_FAILURE_WINDOW:PT15M}
app.security.authentication-protection.lock-duration=${AUTH_LOCK_DURATION:PT15M}
